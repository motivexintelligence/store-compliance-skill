<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How it works: scan, verify, report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1328"/>
      <stop offset="1" stop-color="#16123A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6B7BC4"/>
    </marker>
  </defs>
  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- 1 repo -->
    <g transform="translate(48 60)">
      <rect width="240" height="180" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="40" font-size="13" font-weight="700" fill="#8FA8FF" letter-spacing="1.5">01 · INPUT</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#FFFFFF">Your repos</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B7C0E8">
        <text x="24" y="104">pubspec.yaml · package.json</text>
        <text x="24" y="126">Info.plist · PrivacyInfo</text>
        <text x="24" y="148">AndroidManifest · gradle</text>
        <text x="24" y="170">lib/ · src/ · l10n</text>
      </g>
    </g>
    <path d="M296 150H352" stroke="#6B7BC4" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 2 scan -->
    <g transform="translate(364 60)">
      <rect width="260" height="180" rx="18" fill="#4F7CFF" fill-opacity="0.10" stroke="#4F7CFF" stroke-opacity="0.45"/>
      <text x="24" y="40" font-size="13" font-weight="700" fill="#8FA8FF" letter-spacing="1.5">02 · SCAN</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#FFFFFF">scan.py</text>
      <text x="24" y="102" font-size="15" fill="#C9D3FF">stdlib only, read-only</text>
      <text x="24" y="126" font-size="15" fill="#C9D3FF">SDKs, permissions, plist,</text>
      <text x="24" y="148" font-size="15" fill="#C9D3FF">targetSdk, billing version</text>
      <text x="24" y="170" font-size="15" fill="#C9D3FF">→ facts + leads (JSON)</text>
    </g>
    <path d="M632 150H688" stroke="#6B7BC4" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 3 verify -->
    <g transform="translate(700 60)">
      <rect width="260" height="180" rx="18" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="24" y="40" font-size="13" font-weight="700" fill="#D3A8FF" letter-spacing="1.5">03 · VERIFY</text>
      <text x="24" y="72" font-size="22" font-weight="700" fill="#FFFFFF">Claude reads code</text>
      <text x="24" y="102" font-size="15" fill="#E2CCFF">confirm, downgrade or drop</text>
      <text x="24" y="126" font-size="15" fill="#E2CCFF">every lead, cite file:line</text>
      <text x="24" y="148" font-size="15" fill="#E2CCFF">presume compliance,</text>
      <text x="24" y="170" font-size="15" fill="#E2CCFF">no guessing past a backend</text>
    </g>
    <path d="M968 150H1024" stroke="#6B7BC4" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 4 report -->
    <g transform="translate(1036 60)">
      <rect width="196" height="180" rx="18" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.45"/>
      <text x="22" y="40" font-size="13" font-weight="700" fill="#8EE6B0" letter-spacing="1.5">04 · REPORT</text>
      <text x="22" y="72" font-size="22" font-weight="700" fill="#FFFFFF">Markdown</text>
      <g font-size="15" font-weight="600">
        <circle cx="30" cy="98" r="6" fill="#F43F5E"/><text x="44" y="103" fill="#FFC2CD">Critical</text>
        <circle cx="30" cy="122" r="6" fill="#F59E0B"/><text x="44" y="127" fill="#FFE2A8">Important</text>
        <circle cx="30" cy="146" r="6" fill="#4F7CFF"/><text x="44" y="151" fill="#C9D3FF">Suggestion</text>
        <rect x="24" y="164" width="12" height="12" rx="3" fill="none" stroke="#8EE6B0" stroke-width="2"/><text x="44" y="175" fill="#BFF5D2">Manual check</text>
      </g>
    </g>
  </g>
</svg>
