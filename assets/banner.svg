<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="store-compliance: App Store and Google Play policy audit for mobile repositories">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0D1117"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="320" fill="#4F7CFF"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="64" font-weight="700" fill="#F0F3F6" letter-spacing="-1.5">store-compliance</text>
    <text x="82" y="196" font-size="24" fill="#9198A1">App Store and Google Play policy audit for mobile repositories</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6E7681">
      <text x="82" y="250">Flutter · React Native · Expo · native iOS and Android</text>
    </g>
  </g>

  <!-- severity legend, right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" transform="translate(1000 112)">
    <rect x="-24" y="-28" width="216" height="152" rx="10" fill="#161B22" stroke="#30363D"/>
    <circle cx="0" cy="0" r="6" fill="#F85149"/><text x="18" y="5" fill="#C9D1D9">critical</text>
    <circle cx="0" cy="32" r="6" fill="#D29922"/><text x="18" y="37" fill="#C9D1D9">important</text>
    <circle cx="0" cy="64" r="6" fill="#4F7CFF"/><text x="18" y="69" fill="#C9D1D9">suggestion</text>
    <rect x="-6" y="90" width="12" height="12" rx="2" fill="none" stroke="#8B949E" stroke-width="1.5"/><text x="18" y="101" fill="#C9D1D9">manual check</text>
  </g>
</svg>
